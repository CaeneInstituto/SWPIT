<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo - Inteligencia de Paquetes</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #f9fafb;
        }
        .demo-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #374151;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .input-group input:focus {
            outline: none;
            border-color: #0d9488;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1);
        }
        .analysis-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid;
        }
        .analysis-box.blue { background: #eff6ff; border-color: #bfdbfe; color: #1e40af; }
        .analysis-box.pink { background: #fdf2f8; border-color: #fbcfe8; color: #be185d; }
        .analysis-box.green { background: #f0fdf4; border-color: #bbf7d0; color: #166534; }
        .analysis-box.gray { background: #f9fafb; border-color: #d1d5db; color: #374151; }
        .analysis-box.yellow { background: #fffbeb; border-color: #fde68a; color: #92400e; }
        .analysis-header {
            display: flex;
            align-items: start;
            gap: 10px;
            margin-bottom: 15px;
        }
        .analysis-icon {
            font-size: 24px;
        }
        .analysis-content h4 {
            margin: 0 0 8px 0;
            font-size: 18px;
            font-weight: 700;
        }
        .analysis-description {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .examples-section {
            border-top: 1px solid rgba(0,0,0,0.1);
            padding-top: 15px;
        }
        .examples-title {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .examples-list {
            font-size: 13px;
            opacity: 0.9;
            line-height: 1.5;
        }
        .examples-list li {
            margin-bottom: 4px;
            display: flex;
            align-items: start;
            gap: 6px;
        }
        .demo-title {
            text-align: center;
            color: #1f2937;
            margin-bottom: 30px;
        }
        .demo-subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 40px;
            font-size: 16px;
        }
        .presets {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .preset-btn {
            padding: 8px 16px;
            background: #f3f4f6;
            border: 2px solid #d1d5db;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .preset-btn:hover {
            background: #e5e7eb;
            border-color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <h1 class="demo-title">🧠 Demo - Inteligencia de Paquetes</h1>
        <p class="demo-subtitle">
            Esta es la funcionalidad que se añade al admin para detectar automáticamente 
            el tipo de paquete basado en el nombre y precio
        </p>

        <div class="presets">
            <button class="preset-btn" onclick="setPreset('Triple', 'S/ 280')">Triple</button>
            <button class="preset-btn" onclick="setPreset('Cuádruple', 'S/ 320')">Cuádruple</button>
            <button class="preset-btn" onclick="setPreset('Quintuple', 'S/ 380')">Quintuple</button>
            <button class="preset-btn" onclick="setPreset('Promo Parejas', 'S/ 249')">Promo Parejas</button>
            <button class="preset-btn" onclick="setPreset('Paquete a partir de 3', 'S/ 135')">A partir de 3</button>
            <button class="preset-btn" onclick="setPreset('Individual', 'S/ 180')">Individual</button>
        </div>

        <div class="input-group">
            <label for="packageName">Nombre del Paquete:</label>
            <input type="text" id="packageName" placeholder="Ej: Triple, Cuádruple, Promo Parejas..." oninput="analyzePackage()">
        </div>

        <div class="input-group">
            <label for="packagePrice">Precio:</label>
            <input type="text" id="packagePrice" placeholder="Ej: S/ 280" oninput="analyzePackage()">
        </div>

        <div id="analysisResult"></div>
    </div>

    <script>
        function setPreset(name, price) {
            document.getElementById('packageName').value = name;
            document.getElementById('packagePrice').value = price;
            analyzePackage();
        }

        function analyzePackageType(label, price) {
            const labelLower = label.toLowerCase();
            const priceNum = parseFloat(price.replace(/[^\d.]/g, '')) || 0;
            
            const analysis = {
                type: 'unknown',
                personsIncluded: 1,
                isFixed: false,
                isGroup: false,
                isCouple: false,
                description: '',
                examples: []
            };
            
            // Detectar patrones específicos
            if (labelLower.includes('quintuple') || labelLower.includes('quíntuple')) {
                analysis.type = 'habitacion-fija';
                analysis.personsIncluded = 5;
                analysis.isFixed = true;
                analysis.description = 'Habitación fija para 5 personas';
                analysis.examples = [
                    `5 personas → 1 Quintuple (S/ ${priceNum.toFixed(0)})`,
                    '6 personas → 1 Quintuple + 1 individual',
                    '10 personas → 2 Quintuples exactos'
                ];
            } else if (labelLower.includes('cuádruple') || labelLower.includes('cuadruple')) {
                analysis.type = 'habitacion-fija';
                analysis.personsIncluded = 4;
                analysis.isFixed = true;
                analysis.description = 'Habitación fija para 4 personas';
                analysis.examples = [
                    `4 personas → 1 Cuádruple (S/ ${priceNum.toFixed(0)})`,
                    '5 personas → 1 Cuádruple + 1 individual',
                    '8 personas → 2 Cuádruples exactos'
                ];
            } else if (labelLower.includes('triple') && !labelLower.includes('a partir de')) {
                analysis.type = 'habitacion-fija';
                analysis.personsIncluded = 3;
                analysis.isFixed = true;
                analysis.description = 'Habitación fija para 3 personas';
                analysis.examples = [
                    `3 personas → 1 Triple (S/ ${priceNum.toFixed(0)})`,
                    '4 personas → 1 Triple + 1 individual',
                    '6 personas → 2 Triples exactos'
                ];
            } else if ((labelLower.includes('doble') || labelLower.includes('matrimonial')) && !labelLower.includes('pareja')) {
                analysis.type = 'habitacion-fija';
                analysis.personsIncluded = 2;
                analysis.isFixed = true;
                analysis.description = 'Habitación fija para 2 personas';
                analysis.examples = [
                    `2 personas → 1 Doble (S/ ${priceNum.toFixed(0)})`,
                    '3 personas → 1 Doble + 1 individual',
                    '4 personas → 2 Dobles exactos'
                ];
            } else if (labelLower.includes('pareja') || labelLower.includes('parejas')) {
                analysis.type = 'promo-pareja';
                analysis.personsIncluded = 2;
                analysis.isCouple = true;
                analysis.description = 'Promoción de parejas (precio total para 2)';
                analysis.examples = [
                    `2 personas → S/ ${priceNum.toFixed(0)} total (ambos incluidos)`,
                    `4 personas → 2 Promos de pareja = S/ ${(priceNum * 2).toFixed(0)}`,
                    `6 personas → 3 Promos de pareja = S/ ${(priceNum * 3).toFixed(0)}`
                ];
            } else if (labelLower.includes('a partir de 3') || labelLower.includes('apartir de 3')) {
                analysis.type = 'precio-grupal';
                analysis.personsIncluded = 1;
                analysis.isGroup = true;
                analysis.description = 'Precio por persona cuando hay 3 o más';
                analysis.examples = [
                    `3 personas → S/ ${priceNum.toFixed(0)} c/u = S/ ${(priceNum * 3).toFixed(0)}`,
                    `5 personas → S/ ${priceNum.toFixed(0)} c/u = S/ ${(priceNum * 5).toFixed(0)}`,
                    'Siempre disponible si el tour total ≥ 3 personas'
                ];
            } else if (labelLower.includes('individual') || labelLower.includes('1 persona')) {
                analysis.type = 'individual';
                analysis.personsIncluded = 1;
                analysis.description = 'Precio individual por persona';
                analysis.examples = [
                    `1 persona → S/ ${priceNum.toFixed(0)}`,
                    `2 personas → S/ ${priceNum.toFixed(0)} c/u = S/ ${(priceNum * 2).toFixed(0)}`,
                    'Recomendado solo para tours de 1-2 personas'
                ];
            } else {
                analysis.description = 'Paquete estándar (revisar configuración)';
                analysis.examples = [
                    'No se detectó tipo específico',
                    'Verifica el nombre del paquete',
                    'Añade palabras clave: Triple, Cuádruple, etc.'
                ];
            }
            
            return analysis;
        }

        function getTypeColor(type) {
            switch (type) {
                case 'habitacion-fija': return 'blue';
                case 'promo-pareja': return 'pink';
                case 'precio-grupal': return 'green';
                case 'individual': return 'gray';
                default: return 'yellow';
            }
        }

        function getTypeIcon(type) {
            switch (type) {
                case 'habitacion-fija': return '🏨';
                case 'promo-pareja': return '💕';
                case 'precio-grupal': return '👥';
                case 'individual': return '👤';
                default: return '📦';
            }
        }

        function analyzePackage() {
            const label = document.getElementById('packageName').value;
            const price = document.getElementById('packagePrice').value;
            const resultDiv = document.getElementById('analysisResult');
            
            if (!label || !price) {
                resultDiv.innerHTML = '';
                return;
            }
            
            const analysis = analyzePackageType(label, price);
            const color = getTypeColor(analysis.type);
            const icon = getTypeIcon(analysis.type);
            
            let behaviorText = '';
            if (analysis.isFixed) {
                behaviorText = `Agrupa ${analysis.personsIncluded} personas automáticamente`;
            } else if (analysis.isCouple) {
                behaviorText = `Precio total dividido entre 2 personas`;
            } else if (analysis.isGroup) {
                behaviorText = `Se aplica individualmente cuando hay 3+ personas totales`;
            } else if (analysis.type === 'individual') {
                behaviorText = `Precio por persona individual`;
            } else {
                behaviorText = `Añade palabras clave para mejor detección`;
            }
            
            resultDiv.innerHTML = `
                <div class="analysis-box ${color}">
                    <div class="analysis-header">
                        <div class="analysis-icon">${icon}</div>
                        <div class="analysis-content">
                            <h4>${analysis.description}</h4>
                            <p class="analysis-description">${behaviorText}</p>
                        </div>
                    </div>
                    ${analysis.examples.length > 0 ? `
                        <div class="examples-section">
                            <p class="examples-title">🧪 Ejemplos de uso:</p>
                            <ul class="examples-list">
                                ${analysis.examples.map(example => 
                                    `<li><span>•</span><span>${example}</span></li>`
                                ).join('')}
                            </ul>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // Demo inicial
        setTimeout(() => setPreset('Triple', 'S/ 280'), 500);
    </script>
</body>
</html>
